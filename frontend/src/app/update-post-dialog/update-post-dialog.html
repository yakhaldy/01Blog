<h2 mat-dialog-title>Update Post</h2>

<mat-dialog-content class="dialog-content">
    <div class="imput-continer">
       
         <mat-form-field class="post-textarea" appearance="outline">
             <textarea matInput [ngModel]="getTitle()" (ngModelChange)="setTitle($event)" name="postTitle" rows="4"
                placeholder="What's happening?" maxlength="280" aria-label="Post title"
                [class.error]="isCharacterTitleLimitExceeded()">
        </textarea>
            <mat-hint [class.error-hint]="isCharacterLimitExceeded()">
                {{ postTitleCharacterCount() }}/280
            </mat-hint>
        </mat-form-field>
        <mat-form-field class="post-textarea" appearance="outline">
            <textarea matInput [ngModel]="getDescription()" (ngModelChange)="setDescription($event)" name="postDescription" rows="4"
                placeholder="What's happening?" maxlength="5000" aria-label="Post content"
                [class.error]="isCharacterLimitExceeded()">
        </textarea>
            <mat-hint [class.error-hint]="isCharacterLimitExceeded()">
                {{ postCharacterCount() }}/1000
            </mat-hint>
        </mat-form-field>

        <!-- File Upload Section -->
        <div class="file-upload-section">
            <label for="fileinput" class="file-upload-label" matTooltip="Upload new media">
                <img src="assets/img/upload.png" alt="Upload" class="iconImageInput">
                <span *ngIf="selectedFileNames().length + currentImageUrls().length > 0" class="file-count">
                    {{ selectedFileNames().length + currentImageUrls().length }}/3
                </span>
            </label>
            <input type="file" id="fileinput" (change)="onFileSelected($event)" accept="image/*,video/*"
                multiple [disabled]="selectedFileNames().length + currentImageUrls().length >= 3"
                style="display: none;">
        </div>
    </div>
    
    <!-- Current Images Display -->
    <div *ngIf="hasCurrentImages()" class="current-media">
        <p class="media-label">Current images:</p>
        <div class="media-grid">
            <div *ngFor="let imgUrl of currentImageUrls(); let i = index" class="media-item">
                <img *ngIf="isImage(imgUrl)" [src]="getImage(imgUrl)" class="current-image" loading="lazy">
                <video *ngIf="isVideo(imgUrl)" [src]="getImage(imgUrl)" controls class="current-video" preload="metadata">
                    Your browser does not support the video tag.
                </video>
                <button type="button" class="remove-current-btn" (click)="removeCurrentImage(i)" mat-icon-button
                    matTooltip="Remove image">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- New File Preview with Image/Video Display -->
    <div *ngIf="hasNewFiles()" class="file-preview-container">
        <p class="media-label">New images:</p>
        <div class="media-grid">
            <div *ngFor="let previewUrl of filePreviewUrls(); let i = index" class="media-item">
                <img *ngIf="isImageFile(selectedFileNames()[i])" [src]="previewUrl" alt="Selected image preview"
                    class="file-preview-image" loading="lazy">
                <video *ngIf="isVideoFile(selectedFileNames()[i])" [src]="previewUrl" controls class="file-preview-video"
                    preload="metadata">Your browser does not support the video tag.</video>
                <button type="button" class="remove-file-btn" (click)="removeMediaFile(i)" aria-label="Remove file">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- Validation Messages -->
    <div *ngIf="getDescription().trim().length === 0" class="validation-message error">
        Post content cannot be empty
    </div>
    <div *ngIf="isCharacterLimitExceeded()" class="validation-message error">
        Post exceeds maximum character limit
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="footer">
    <button mat-button (click)="cancel()" type="button">
        Cancel
    </button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="!isPostValid()" type="button">
        Update Post
    </button>
</mat-dialog-actions>
