<nav class="navbar">
  <div class="navbar-container">
    <!-- Left Section - Logo and Brand -->
    <div class="navbar-left">
      <div class="logo-section">
        <div class="brand-section">
          <h2 class="brand-name">01 Blog</h2>
          <div class="decorative-line"></div>
        </div>
      </div>
    </div>

    <!-- Center Section - Navigation Links -->
    <div class="navbar-center">
      <div class="nav-links">
        <button class="nav-btn" [class.active]="isRouteActive('/')" (click)="onHome()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          <span class="title">Home</span>
        </button>

        <button class="nav-btn" [class.active]="isRouteActive('/profile')" (click)="onProfile()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
          </svg>
          <span class="title">Profile</span>
        </button>

        <button class="nav-btn notification-btn" [class.active]="isRouteActive('/notifications')"
          (click)="onNotifications()">
          <div class="notification-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
            </svg>
            <span class="notification-badge" *ngIf="notificationCount() > 0">
              {{ notificationCount() < 100 ? notificationCount() : '+99' }} </span>

          </div>
          <span class="title">Notifications</span>
        </button>
      </div>
    </div>

    <!-- Right Section - User Profile -->
    <div class="navbar-right">
      <div class="user-section" (click)="toggleDropdown()">
        <div class="user-avatar">
          <img [src]="getImage(currentUser()?.avatar) || 'assets/img/default-avatar.png'"
            [alt]="currentUser()?.username + ' profile picture'" class="avatar-img" loading="lazy">
        </div>
        <div class="user-info">
          <span class="user-name">{{ currentUser()?.username ?? 'User' }}</span>
          <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
            [class.rotated]="isDropdownOpen()">
            <path d="M7 10l5 5 5-5z" />
          </svg>
        </div>
      </div>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu" [class.show]="isDropdownOpen()">
        <button *ngIf="isAdmin()" class="dropdown-item" (click)="onDashboard()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
          </svg>
          Dashboard
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item logout-item" (click)="onLogout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
          </svg>
          Logout
        </button>
      </div>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
      </svg>
    </button>

  </div>

  <div class="mobile-nav-menu" [class.open]="isMobileMenuOpen()">
    <button class="nav-btn" (click)="onHome(); closeMobileMenu()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" (click)="onProfile(); closeMobileMenu()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
      <span>Profile</span>
    </button>
    <button class="nav-btn" (click)="onNotifications(); closeMobileMenu()">
      <div class="notification-wrapper">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
        </svg>
        <span class="notification-badge" *ngIf="notificationCount() > 0">{{notificationCount()}} </span>
      </div>
      <span>Notifications</span>
    </button>
    <!-- <button *ngIf="isAdmin()" (click)="onDashboard(); closeMobileMenu()">Dashboard</button>
    <button class="logout-btn" (click)="onLogout(); closeMobileMenu()">Logout</button> -->
  </div>


  <!-- Overlay for dropdown -->
  <!-- <div class="dropdown-overlay" [class.show]="isDropdownOpen" (click)="toggleDropdown()"></div> -->
</nav>
