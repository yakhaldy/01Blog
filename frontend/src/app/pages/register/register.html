<form (ngSubmit)="onRegister()" #registerForm="ngForm">
  <app-logo></app-logo>

  <div class="form-grid">
    <div class="inputGroup">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" [(ngModel)]="firstName" name="firstName" placeholder="Enter your first name" required />
    </div>

    <div class="inputGroup">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" [(ngModel)]="lastName" name="lastName" placeholder="Enter your last name" required />
    </div>

    <div class="inputGroup">
      <label for="username">Username</label>
      <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Choose a username" required />
    </div>

    <div class="inputGroup">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="email@domain.com" required />
    </div>

    <div class="inputGroup">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="••••••••" 
        (input)="checkPasswordStrength(); checkPasswordMatch()"
        required 
      />
      <div class="password-strength" [ngClass]="passwordStrengthClass">
        <div class="password-strength-bar"></div>
      </div>
    </div>

    <div class="inputGroup">
      <label for="confirmPassword">Confirm Password</label>
      <input 
        type="password" 
        id="confirmPassword" 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword" 
        placeholder="••••••••" 
        (input)="checkPasswordMatch()"
        required 
      />
      <div class="password-match" [ngClass]="passwordMatchClass">
        {{ passwordMatchMessage }}
      </div>
    </div>

    <div class="inputGroup">
      <label for="gender">Gender</label>
      <select id="gender" [(ngModel)]="gender" name="gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
        <option value="prefer-not-to-say">Prefer not to say</option>
      </select>
    </div>

    <div class="inputGroup">
      <label for="age">Age</label>
      <input type="number" id="age" [(ngModel)]="age" name="age" placeholder="Enter your age" min="13" max="120" />
    </div>

    <div class="inputGroup full-width">
      <label for="about">About</label>
      <textarea id="about" [(ngModel)]="about" name="about" placeholder="Tell us about yourself (optional)" rows="3"></textarea>
    </div>

    <div class="inputGroup full-width">
      <label for="photo">Profile Photo</label>
      <input type="file" id="photo" (change)="onFileChange($event)" accept="image/*" />
    </div>

    <div class="inputGroupg full-width">
      <button type="submit" [disabled]="!isFormValid()">Register</button>
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</form>
