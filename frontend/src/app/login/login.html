<div class="login-container">
</div class="container">
  <div class="left"></div>
    <div class="right">
      <h2>Sign in</h2>
      <p>Welcome to 01 Blog</p>
      
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" [(ngModel)]="user.email"  placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="user.password" placeholder="Enter your password" required>
        </div>

        <button class="btn" type="submit">Login</button>
      </form>

      <div class="signUp">
        <!-- Already a member? <a href="#">Sign up</a> -->
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
      </div>
    </div>
    </div>
</div>
