<div class="login-container">
    <div class="creative-bg">
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-circle circle-3"></div>
    <div class="floating-triangle"></div>
    <div class="floating-square"></div>
  </div>

  <div class="container">

     <div class="left">
      <div class="creative-overlay">
        <div class="artistic-content">
          <h1 class="welcome-text">Welcome to</h1>
          <h2 class="brand-name">01 Blog</h2>
          <div class="decorative-line"></div>
          <p class="tagline">Join the creative community</p>
        </div>
        <div class="art-shapes">
          <div class="shape-dot dot-1"></div>
          <div class="shape-dot dot-2"></div>
          <div class="shape-dot dot-3"></div>
        </div>
      </div>
    </div>

    <div class="right">
      <h2 class="creative-title" >Sign in</h2>
      <p class="creative-subtitle">Welcome to 01 Blog</p>

      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" [(ngModel)]="user.email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="user.password" name="password" placeholder="Enter your password" required>
        </div>

         <button class="btn creative-btn" type="submit">
          <span class="btn-content">Login</span>
          <div class="btn-ripple"></div>
        </button>
      </form>
       <p *ngIf="errorMessage" class="error-message creative-message">
        <span class="message-icon">⚠</span>
        {{ errorMessage }}
      </p>
       <div class="signUp creative-link-section">
        <p>Don't have an account?  
          <a  (click)="goToPath('register')" class="enhanced-link">
            Register here
            <span class="link-hover-effect"></span>
          </a>
        </p>
      </div>
    </div>
  </div>
</div>


<!-- *ngIf="errorMessage" -->
