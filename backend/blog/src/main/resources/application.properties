# Database config from env
spring.datasource.url=jdbc:postgresql://localhost:5432/blogdb
spring.datasource.username=bloguser
spring.datasource.password=StrongPassword123!


# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari pool configuration
# Increase pool size to handle concurrent requests + SSE connections
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Reduce timeout to fail fast rather than queuing requests
spring.datasource.hikari.connection-timeout=10000
# Return idle connections quickly
spring.datasource.hikari.idle-timeout=300000
# Recycle connections periodically
spring.datasource.hikari.max-lifetime=1200000
# Enable leak detection in development
spring.datasource.hikari.leak-detection-threshold=60000

# File upload limits
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.max-file-size=20MB
# JWT secret
jwt.secret=mySuperSecretKeyThatIsAtLeast256BitsLongAndSecure123456789

# Transaction timeout
spring.transaction.default-timeout=30
