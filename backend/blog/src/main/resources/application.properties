# Database config from env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bloguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:blogpassword}


# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari pool configuration
# Increase pool size to handle concurrent requests + SSE connections
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Reduce timeout to fail fast rather than queuing requests
spring.datasource.hikari.connection-timeout=10000
# Return idle connections quickly
spring.datasource.hikari.idle-timeout=300000
# Recycle connections periodically
spring.datasource.hikari.max-lifetime=1200000
# Enable leak detection in development
spring.datasource.hikari.leak-detection-threshold=60000

# File upload limits
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}

# JWT secret
jwt.secret=${JWT_SECRET}

# CORS allowed origins
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8000}

# Server port
server.port=${SERVER_PORT:8080}

# Transaction timeout
spring.transaction.default-timeout=30
